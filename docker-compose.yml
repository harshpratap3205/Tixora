version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tixora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tixora}
      POSTGRES_USER: ${POSTGRES_USER:-tixora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tixora_secret_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tixora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tixora} -d ${POSTGRES_DB:-tixora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tixora-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-tixora}:${POSTGRES_PASSWORD:-tixora_secret_dev_password}@postgres:5432/${POSTGRES_DB:-tixora}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-tixora_v1_production_grade_hmac_sha256_access_secret_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-tixora_v1_production_grade_hmac_sha256_refresh_secret_key_2026}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-tixora_v1_qr_ticket_hmac_sha256_verification_secret_key_2026}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_tixora_sandbox_signature_secret_2026}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: tixora-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  tixora_pgdata:
